            <div class="rc-summary">
              <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px">
                <span><strong>Total:</strong> <span id="rcTotalDisplay">R$ 0,00</span></span>
                <span id="rcLimiteStatus" style="font-weight:600;"></span>
              </div>
            </div>

            <div class="form-actions">
              <button type="submit" class="btn btn-accent" id="btnSalvarRascunho">${isEdit ? 'Salvar Alterações' : 'Salvar como Rascunho'}</button>
              <button type="button" class="btn btn-accent" id="btnEnviarRC" disabled>Enviar para Aprovação</button>
              <button type="reset" class="btn btn-ghost">Limpar</button>
            </div>
          </form>
        </div>
      `;
    }

    /* ============================================================
       FUNÇÕES AUXILIARES RC
    ============================================================ */
    function addItemRowRC(container, itemData = null) {
      const row = document.createElement('div');
      row.className = 'rc-item-row';
      row.innerHTML = `
        <div class="field" style="flex:3"><label>Código/Descrição</label><input type="text" class="rc-item-busca" placeholder="Digite para buscar..." value="${itemData ? itemData.descricao || '' : ''}" /></div>
        <div class="field" style="flex:1"><label>Quantidade</label><input type="number" class="rc-item-qtd" min="1" value="${itemData ? itemData.qtd : 1}" /></div>
        <div class="field" style="flex:1"><label>Valor Unit.</label><input type="text" class="rc-item-unit" placeholder="0,00" value="${itemData ? itemData.valorUnit || '' : ''}" /></div>
        <div class="field" style="flex:1"><label>Total</label><input type="text" class="rc-item-total" readonly style="background:#1a1f1a;" value="${itemData ? fmt.money(itemData.total || 0) : ''}" /></div>
        <button type="button" class="btn btn-danger" style="align-self:flex-end;margin-bottom:2px;" onclick="removerItemRC(this)">×</button>
      `;
      container.appendChild(row);
      const buscaInput = row.querySelector('.rc-item-busca');
      const qtdInput = row.querySelector('.rc-item-qtd');
      const unitInput = row.querySelector('.rc-item-unit');
      const totalInput = row.querySelector('.rc-item-total');

      const updateTotal = () => {
        const qtd = parseFloat(qtdInput.value) || 0;
        const unit = parseMoney(unitInput.value);
        const total = qtd * unit;
        totalInput.value = total ? fmt.money(total) : '';
        recalcularTotalRC();
      };
      qtdInput.addEventListener('input', updateTotal);
      unitInput.addEventListener('input', updateTotal);

      buscaInput.addEventListener('input', (e) => {
        const term = e.target.value.trim().toLowerCase();
        if (term.length < 2) return;
        const matches = allItems.filter(item =>
          item.codigo.toLowerCase().includes(term) ||
          item.descricaoSimples.toLowerCase().includes(term) ||
          (item.descricaoCurta && item.descricaoCurta.toLowerCase().includes(term))
        ).slice(0, 5);
        if (matches.length === 1) {
          const item = matches[0];
          buscaInput.value = item.codigo + ' - ' + item.descricaoSimples;
          if (!unitInput.value) {
            unitInput.value = item.custoUnitario ? item.custoUnitario.replace('R$ ', '').replace(',', '.') : '';
            updateTotal();
          }
        } else if (matches.length > 1) {
          const datalistId = 'rc-datalist-' + Date.now();
          let datalist = document.getElementById(datalistId);
          if (!datalist) {
            datalist = document.createElement('datalist');
            datalist.id = datalistId;
            document.body.appendChild(datalist);
          }
          datalist.innerHTML = matches.map(m => `<option value="${m.codigo} - ${m.descricaoSimples}"></option>`).join('');
          buscaInput.setAttribute('list', datalistId);
          buscaInput.addEventListener('change', function() {
            const val = this.value;
            const found = matches.find(m => (m.codigo + ' - ' + m.descricaoSimples) === val);
            if (found && !unitInput.value) {
              unitInput.value = found.custoUnitario ? found.custoUnitario.replace('R$ ', '').replace(',', '.') : '';
              updateTotal();
            }
          }, { once: false });
        }
      });
    }

    function removerItemRC(btn) {
      const row = btn.closest('.rc-item-row');
      if (row) { row.remove(); recalcularTotalRC(); }
    }

    function recalcularTotalRC() {
      const totals = document.querySelectorAll('.rc-item-total');
      let sum = 0;
      totals.forEach(input => {
        const val = parseMoney(input.value);
        if (!isNaN(val)) sum += val;
      });
      const display = document.getElementById('rcTotalDisplay');
      if (display) display.textContent = fmt.money(sum);

      // Verificar limite
      const destinoSelect = document.getElementById('rcDestino');
      const limiteDisplay = document.getElementById('rcLimiteDisplay');
      const btnEnviar = document.getElementById('btnEnviarRC');
      const statusEl = document.getElementById('rcLimiteStatus');

      if (destinoSelect && destinoSelect.value) {
        const limite = parseMoney(limiteDisplay.value);
        if (sum > limite && limite > 0) {
          btnEnviar.disabled = true;
          statusEl.innerHTML = '<span class="limite-excedido">⚠️ VALOR LIMITE ATINGIDO, SOLICITE APROVAÇÃO</span>';
        } else {
          btnEnviar.disabled = false;
          statusEl.innerHTML = '<span style="color:var(--accent);">✅ Dentro do limite</span>';
        }
      } else {
        btnEnviar.disabled = true;
        statusEl.innerHTML = '<span style="color:var(--text-muted);">Selecione um destino</span>';
      }
      return sum;
    }

    function calcularVencimento(dataBase, condPag) {
      if (!dataBase) return '';
      const dias = parseInt(condPag) || 0;
      const dt = new Date(dataBase);
      if (isNaN(dt.getTime())) return '';
      dt.setDate(dt.getDate() + dias);
      return dt.toISOString().slice(0,10);
    }

    /* ============================================================
       HANDLERS DAS RCs
    ============================================================ */
    function handleNovaRC() {
      const container = document.getElementById('rcFormContainer');
      if (!container) return;
      container.innerHTML = renderFormRC();
      const itensContainer = document.getElementById('rcItensContainer');
      if (itensContainer) addItemRowRC(itensContainer);
      document.getElementById('btnAddItemRC')?.addEventListener('click', () => {
        const c = document.getElementById('rcItensContainer');
        if (c) addItemRowRC(c);
      });
      document.getElementById('rcDataBase')?.addEventListener('change', function() {
        const condPag = document.getElementById('rcCondPag')?.value || '0';
        const venc = calcularVencimento(this.value, condPag);
        const vencInput = document.getElementById('rcVencimento');
        if (vencInput) vencInput.value = venc;
      });
      document.getElementById('rcCondPag')?.addEventListener('change', function() {
        const dataBase = document.getElementById('rcDataBase')?.value;
        const venc = calcularVencimento(dataBase, this.value);
        const vencInput = document.getElementById('rcVencimento');
        if (vencInput) vencInput.value = venc;
      });
      document.getElementById('rcDestino')?.addEventListener('change', function() {
        const selected = this.options[this.selectedIndex];
        const limite = selected ? parseMoney(selected.dataset.limite) : 0;
        const display = document.getElementById('rcLimiteDisplay');
        if (display) display.value = fmt.money(limite);
        recalcularTotalRC();
      });
      document.getElementById('formRC')?.addEventListener('submit', function(e) {
        e.preventDefault();
        salvarRascunho(false);
      });
      document.getElementById('btnEnviarRC')?.addEventListener('click', function() {
        salvarRascunho(true);
      });
      document.getElementById('btnCancelarFormRC')?.addEventListener('click', () => {
        document.getElementById('rcFormContainer').innerHTML = '';
        render();
      });
      // Inicializar limite
      const destinoSelect = document.getElementById('rcDestino');
      if (destinoSelect) {
        const selected = destinoSelect.options[destinoSelect.selectedIndex];
        if (selected && selected.value) {
          const limite = parseMoney(selected.dataset.limite);
          const display = document.getElementById('rcLimiteDisplay');
          if (display) display.value = fmt.money(limite);
        }
        recalcularTotalRC();
      }
    }

    function salvarRascunho(enviar = false) {
      const getVal = (id) => document.getElementById(id)?.value || '';
      const numero = getVal('rcNumero');
      const data = getVal('rcData');
      const fornecedor = getVal('rcFornecedor');
      const prazoEntrega = getVal('rcPrazoEntrega');
      const condPag = getVal('rcCondPag');
      const dataBase = getVal('rcDataBase');
      const vencimento = getVal('rcVencimento');
      const solicitante = getVal('rcSolicitante');
      const aplicacao = getVal('rcDestino');
      const observacoes = getVal('rcObservacoes');

      if (!fornecedor || !data || !prazoEntrega || !condPag || !dataBase || !solicitante || !aplicacao) {
        showToast('Preencha todos os campos obrigatórios.', true);
        return;
      }

      const rows = document.querySelectorAll('.rc-item-row');
      const itens = [];
      let total = 0;
      rows.forEach(row => {
        const descInput = row.querySelector('.rc-item-busca');
        const qtdInput = row.querySelector('.rc-item-qtd');
        const unitInput = row.querySelector('.rc-item-unit');
        const desc = descInput ? descInput.value.trim() : '';
        const qtd = parseFloat(qtdInput?.value) || 0;
        const unit = parseMoney(unitInput?.value || '0');
        const totalItem = qtd * unit;
        if (desc && qtd > 0) {
          itens.push({ descricao: desc, qtd, valorUnit: unit, total: totalItem });
          total += totalItem;
        }
      });
      if (itens.length === 0) {
        showToast('Adicione pelo menos um item.', true);
        return;
      }

      // Validar limite
      const frota = getFrotaByNome(aplicacao);
      if (frota) {
        const limite = frota.valorOrcamento * (limitePercentual / 100);
        if (total > limite) {
          showToast('VALOR LIMITE ATINGIDO! Solicite aprovação ao gerente.', true);
          return;
        }
      }

      const existing = rcs.find(r => r.numero === numero);
      const status = enviar ? 'em_aprovacao' : 'rascunho';
      const rcData = {
        numero,
        data,
        fornecedor,
        prazoEntrega,
        condPag,
        dataBase,
        vencimento,
        solicitante,
        aplicacao,
        observacoes,
        itens,
        total,
        status,
        criadoPor: perfilAtual,
        justificativa: '',
      };

      if (existing) {
        updateRC(numero, rcData);
        showToast(`Requisição ${numero} atualizada.`);
      } else {
        addRC(rcData);
        showToast(`Requisição ${numero} criada como ${status}.`);
      }

      if (enviar) {
        enviarWhatsApp(rcData);
      }

      document.getElementById('rcFormContainer').innerHTML = '';
      render();
    }

    /* ============================================================
       GERAR PDF E WHATSAPP
    ============================================================ */
    function gerarPDF(rcData) {
      const container = document.createElement('div');
      container.style.cssText = 'position:absolute;left:-9999px;top:0;width:800px;background:white;color:black;padding:30px;font-family:Arial,sans-serif;';
      container.innerHTML = `
        <div style="text-align:center;margin-bottom:20px;">
          <h2>Requisição de Compra</h2>
          <p><strong>${rcData.numero}</strong></p>
          <p>Data: ${rcData.data}</p>
        </div>
        <div style="border:1px solid #ccc;padding:10px;margin-bottom:15px;">
          <p><strong>Fornecedor:</strong> ${rcData.fornecedor}</p>
          <p><strong>Prazo de Entrega:</strong> ${rcData.prazoEntrega}</p>
          <p><strong>Condição de Pagamento:</strong> ${rcData.condPag}</p>
          <p><strong>Data Base:</strong> ${rcData.dataBase} | <strong>Vencimento:</strong> ${rcData.vencimento}</p>
          <p><strong>Solicitante:</strong> ${rcData.solicitante}</p>
          <p><strong>Destino:</strong> ${rcData.aplicacao || '—'}</p>
        </div>
        <table style="width:100%;border-collapse:collapse;font-size:12px;">
          <thead><tr style="background:#eee;"><th style="border:1px solid #ccc;padding:6px;">Item</th><th style="border:1px solid #ccc;padding:6px;">Descrição</th><th style="border:1px solid #ccc;padding:6px;">Qtd</th><th style="border:1px solid #ccc;padding:6px;">Valor Unit.</th><th style="border:1px solid #ccc;padding:6px;">Total</th></tr></thead>
          <tbody>
            ${(rcData.itens || []).map((item, idx) => `
              <tr><td style="border:1px solid #ccc;padding:6px;">${idx+1}</td><td style="border:1px solid #ccc;padding:6px;">${item.descricao}</td><td style="border:1px solid #ccc;padding:6px;">${item.qtd}</td><td style="border:1px solid #ccc;padding:6px;">${fmt.money(item.valorUnit)}</td><td style="border:1px solid #ccc;padding:6px;">${fmt.money(item.total)}</td></tr>
            `).join('')}
            <tr><td colspan="4" style="text-align:right;border:1px solid #ccc;padding:6px;"><strong>Total</strong></td><td style="border:1px solid #ccc;padding:6px;"><strong>${fmt.money(rcData.total)}</strong></td></tr>
          </tbody>
        </table>
        <div style="margin-top:20px;font-size:11px;color:#666;">
          <p>Observações: ${rcData.observacoes || ''}</p>
          <p>Gerado em ${new Date().toLocaleString()}</p>
        </div>
      `;
      document.body.appendChild(container);

      html2canvas(container, { scale: 2, useCORS: true }).then(canvas => {
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const imgWidth = 210;
        const pageHeight = 297;
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        let heightLeft = imgHeight;
        let position = 0;

        pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;

        while (heightLeft > 0) {
          position = heightLeft - imgHeight;
          pdf.addPage();
          pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight);
          heightLeft -= pageHeight;
        }

        pdf.save(`RC_${rcData.numero}.pdf`);
        document.body.removeChild(container);
        showToast(`PDF da ${rcData.numero} gerado!`);
      }).catch(err => {
        console.error(err);
        showToast('Erro ao gerar PDF.', true);
        document.body.removeChild(container);
      });
    }

    function enviarWhatsApp(rcData) {
      const numbers = getWhatsAppNumbers().filter(n => n && n.trim() !== '');
      if (numbers.length === 0) {
        showToast('Configure números do WhatsApp para aprovação.', true);
        return;
      }

      let mensagem = `*NOVA REQUISIÇÃO DE COMPRA - ${rcData.numero}*\n`;
      mensagem += `Data: ${rcData.data}\n`;
      mensagem += `Solicitante: ${rcData.solicitante}\n`;
      mensagem += `Fornecedor: ${rcData.fornecedor}\n`;
      mensagem += `Destino: ${rcData.aplicacao || '—'}\n`;
      mensagem += `Total: ${fmt.money(rcData.total)}\n\n`;
      mensagem += `*Itens:*\n`;
      (rcData.itens || []).forEach((item, idx) => {
        mensagem += `${idx+1}. ${item.descricao} – Qtd: ${item.qtd} – Unit: ${fmt.money(item.valorUnit)} – Total: ${fmt.money(item.total)}\n`;
      });
      mensagem += `\n*Prazo de Entrega:* ${rcData.prazoEntrega}`;
      mensagem += `\n*Condição de Pagamento:* ${rcData.condPag}`;
      mensagem += `\n*Vencimento:* ${rcData.vencimento}`;
      mensagem += `\n\nPor favor, analise e aprove/rejeite.`;

      const texto = encodeURIComponent(mensagem);
      numbers.forEach((num, index) => {
        setTimeout(() => {
          const url = `https://api.whatsapp.com/send?phone=${num.trim()}&text=${texto}`;
          window.open(url, '_blank');
        }, index * 300);
      });
      gerarPDF(rcData);
    }

    /* ============================================================
       EXPORTAÇÕES E RESET
    ============================================================ */
    function exportCSV() {
      const items = sortItems(getFilteredItems());
      const headers = ["Código", "Descrição", "Categoria", "Subcategoria", "UN", "Custo Unit.", "Fornecedor", "Cadastro Completo", "Marca", "Lead Time"];
      const rows = items.map(i => [
        i.codigo, i.descricaoSimples, i.categoria, i.subcategoria, i.unid,
        i.custoUnitario, i.fornecedor, i.cadastroCompleto, i.marca, i.leadTime,
      ]);
      const csv = [headers, ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(";")).join("\n");
      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "materiais_filtrados.csv";
      a.click();
    }

    function exportDataJS() {
      const all = allItems;
      const categories = getUniqueValues('categoria');
      const subcategories = getUniqueValues('subcategoria');
      const fornecedoresList = getUniqueValues('fornecedor');
      const usuarios = getUniqueValues('usuario');
      const unidades = getUniqueValues('unid');

      const completos = all.filter(i => i.cadastroCompleto.toUpperCase() === "SIM").length;
      const custoMin = all.reduce((s, i) => s + (i.custoEstoqueMinNum || 0), 0);
      const custoMax = all.reduce((s, i) => s + (i.custoEstoqueMaxNum || 0), 0);

      const catCounts = {};
      all.forEach(i => { if (i.categoria) catCounts[i.categoria] = (catCounts[i.categoria] || 0) + 1; });
      const topCat = Object.entries(catCounts).sort((a,b) => b[1]-a[1]).slice(0,12).map(([nome, qtd]) => ({ nome, qtd }));

      const fornCounts = {};
      all.forEach(i => { if (i.fornecedor) fornCounts[i.fornecedor] = (fornCounts[i.fornecedor] || 0) + 1; });
      const topForn = Object.entries(fornCounts).sort((a,b) => b[1]-a[1]).slice(0,8).map(([nome, qtd]) => ({ nome, qtd }));

      const payload = {
        meta: {
          total: all.length,
          completos,
          pendentes: all.length - completos,
          custoEstoqueMin: custoMin,
          custoEstoqueMax: custoMax,
          categoriasCount: categories.length,
          fonte: DATA ? DATA.meta.fonte : "Cadastro de Materiais_rev6_resumo.csv",
        },
        filtros: {
          categorias: categories,
          subcategorias: subcategories,
          fornecedores: fornecedoresList,
          usuarios: usuarios,
          unidades: unidades,
        },
        charts: {
          categorias: topCat,
          fornecedores: topForn,
        },
        items: all,
      };

      const json = JSON.stringify(payload, null, 2);
      const content = "window.MATERIAIS_DATA = " + json + ";\n";
      const blob = new Blob([content], { type: "application/javascript;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "data.js";
      a.click();
      showToast("data.js exportado com sucesso!");
    }

    function resetFilters() {
      state.filters = { busca: "", categoria: "", subcategoria: "", fornecedor: "", cadastroCompleto: "", unidade: "", usuario: "" };
      state.page = 1;
      render();
    }

    /* ============================================================
       RENDER PRINCIPAL
    ============================================================ */
    function render() {
      try {
        const sec = state.section;
        const titleMap = {
          dashboard: { title: 'Dashboard', meta: 'Visão geral do cadastro de materiais' },
          materiais: { title: 'Materiais', meta: 'Lista completa com ações de edição e exclusão' },
          categorias: { title: 'Categorias', meta: 'Distribuição por categoria e subcategoria' },
          fornecedores: { title: 'Fornecedores', meta: 'Gerenciamento de fornecedores' },
          frotas: { title: 'Frotas', meta: 'Cadastro de frotas e orçamentos' },
          novo: { title: 'Novo Cadastro', meta: 'Adicione um novo material à base' },
          requisicoes: { title: 'Requisições de Compra', meta: 'Fluxo completo de aprovação' },
        };
        const info = titleMap[sec] || titleMap.dashboard;
        document.getElementById('pageTitle').textContent = info.title;
        document.getElementById('pageMeta').textContent = info.meta;

        let html = '';
        if (sec === 'dashboard') html = renderDashboard();
        else if (sec === 'materiais') html = renderMateriais();
        else if (sec === 'categorias') html = renderCategorias();
        else if (sec === 'fornecedores') html = renderFornecedores();
        else if (sec === 'frotas') html = renderFrotas();
        else if (sec === 'novo') html = renderNovo();
        else if (sec === 'requisicoes') html = renderRequisicoes();
        else html = '<div class="loading"><span>Carregando…</span></div>';

        document.getElementById('appContent').innerHTML = html;
        bindEvents();
      } catch (err) {
        console.error('Erro ao renderizar:', err);
        document.getElementById('appContent').innerHTML = `
          <div class="card" style="border-color:var(--danger);">
            <p style="color:var(--danger);">Erro ao carregar a página:</p>
            <pre style="color:var(--text-muted);font-size:13px;margin-top:10px;">${err.message}</pre>
            <button class="btn btn-accent" style="margin-top:15px;" onclick="location.reload()">Recarregar</button>
          </div>
        `;
      }
    }

    /* ============================================================
       BIND EVENTS
    ============================================================ */
    function bindEvents() {
      // ===== MATERIAIS =====
      const busca = document.getElementById('fBusca');
      if (busca) busca.addEventListener('input', (e) => { state.filters.busca = e.target.value; state.page=1; render(); });

      const cat = document.getElementById('fCategoria');
      if (cat) cat.addEventListener('change', (e) => { state.filters.categoria = e.target.value; state.filters.subcategoria = ''; state.page=1; render(); });

      ['fSubcategoria','fFornecedor','fCadastro','fUnidade'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('change', (e) => {
          const map = { fSubcategoria:'subcategoria', fFornecedor:'fornecedor', fCadastro:'cadastroCompleto', fUnidade:'unidade' };
          state.filters[map[id]] = e.target.value;
          state.page = 1;
          render();
        });
      });

      document.getElementById('btnApply')?.addEventListener('click', () => { state.page=1; render(); });

      document.querySelectorAll('th[data-sort]').forEach(th => {
        th.addEventListener('click', () => {
          const col = th.dataset.sort;
          if (state.sort.col === col) state.sort.dir = state.sort.dir === 'asc' ? 'desc' : 'asc';
          else { state.sort.col = col; state.sort.dir = 'asc'; }
          render();
        });
      });

      document.querySelectorAll('.page-btn[data-page]').forEach(btn => {
        btn.addEventListener('click', () => {
          const p = btn.dataset.page;
          const filtered = getFilteredItems();
          const pages = Math.max(1, Math.ceil(filtered.length / state.perPage));
          if (p === 'prev') state.page = Math.max(1, state.page - 1);
          else if (p === 'next') state.page = Math.min(pages, state.page + 1);
          else state.page = parseInt(p, 10);
          render();
        });
      });

      document.querySelectorAll('[data-rc-page]').forEach(btn => {
        btn.addEventListener('click', () => {
          const p = btn.dataset.rcPage;
          const filtered = getFilteredRCs();
          const pages = Math.max(1, Math.ceil(filtered.length / state.rcPerPage));
          if (p === 'prev') state.rcPage = Math.max(1, state.rcPage - 1);
          else if (p === 'next') state.rcPage = Math.min(pages, state.rcPage + 1);
          else state.rcPage = parseInt(p, 10);
          render();

      if (formNovo) formNovo.addEventListener('submit', (e) => { e.preventDefault(); handleFormNovo(); });

      // ===== FORNECEDORES =====

        document.getElementById('novoFornecedorModal').classList.add('active');

      document.getElementById('novoBtnNovoFornecedor')?.addEventListener('click', () => {
        document.getElementById('novoFornecedorModal').classList.add('active');
        document.getElementById('novoFornecedorModal').dataset.targetSelect = 'novoFornecedor';
      });
      document.getElementById('editBtnNovoFornecedor')?.addEventListener('click', () => {

        document.getElementById('novoFornecedorModal').dataset.targetSelect = 'editFornecedor';

        document.getElementById('novoFornecedorModal').classList.remove('active');

        document.getElementById('novoFornecedorModal').classList.remove('active');
      });

      document.getElementById('formNovoFornecedor')?.addEventListener('submit', (e) => {

          const select = document.getElementById(targetId);

            select.value = nome;

        document.querySelectorAll('select[id$="Fornecedor"]').forEach(sel => {
          if (sel.id !== targetId) {
            const exists = Array.from(sel.options).some(o => o.value === nome);

              opt.textContent = nome;

          document.getElementById('novoFornecedorContato').value = f.contato || '';
          document.getElementById('novoFornecedorTelefone').value = f.telefone || '';
          document.getElementById('novoFornecedorEmail').value = f.email || '';
          document.getElementById('novoFornecedorObs').value = f.obs || '';
          document.getElementById('novoFornecedorModal').dataset.editId = id;
          document.getElementById('novoFornecedorModal').classList.add('active');

          form.onsubmit = (e) => {
            e.preventDefault();
            const nome = document.getElementById('novoFornecedorNome').value.trim();

            const editId = document.getElementById('novoFornecedorModal').dataset.editId;
            if (editId) {
              const data = {
                nome,
                contato: document.getElementById('novoFornecedorContato').value.trim(),
                telefone: document.getElementById('novoFornecedorTelefone').value.trim(),
                email: document.getElementById('novoFornecedorEmail').value.trim(),
                obs: document.getElementById('novoFornecedorObs').value.trim(),
              };
              if (updateFornecedor(editId, data)) {
                showToast(`Fornecedor "${nome}" atualizado!`);
                document.getElementById('novoFornecedorModal').classList.remove('active');
                document.querySelectorAll('select[id$="Fornecedor"]').forEach(sel => {
                  const opts = Array.from(sel.options);
                  const idx = opts.findIndex(o => o.value === f.nome);
                  if (idx !== -1) {
                    sel.options[idx].textContent = nome;
                    sel.options[idx].value = nome;
                  }
                });
                if (state.section === 'fornecedores') render();

              }

      document.querySelectorAll('[data-excluir-fornecedor]').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = btn.dataset.excluirFornecedor;
          const f = getFornecedorById(id);
          if (!f) return;
          if (confirm(`Excluir fornecedor "${f.nome}"?`)) {
            deleteFornecedor(id);
            showToast(`Fornecedor "${f.nome}" excluído.`);
            document.querySelectorAll('select[id$="Fornecedor"]').forEach(sel => {
              const opt = Array.from(sel.options).find(o => o.value === f.nome);
              if (opt) sel.removeChild(opt);
            });
            if (state.section === 'fornecedores') render();
          }

      });

      // ===== FROTAS =====
      document.getElementById('btnAbrirModalFrota')?.addEventListener('click', () => {
        const nome = prompt('Nome da frota:');
        if (!nome) return;
        const valor = prompt('Valor total do orçamento (ex: 10000):');
        if (!valor) return;
        const valorNum = parseMoney(valor);
        if (valorNum <= 0) { showToast('Valor inválido.', true); return; }
        addFrota(nome, valorNum);
        showToast(`Frota "${nome}" cadastrada com orçamento de ${fmt.money(valorNum)}`);
        if (state.section === 'frotas') render();
      });

      document.querySelectorAll('[data-excluir-frota]').forEach(btn => {
        btn.addEventListener('click', () => {
          const perfil = perfilAtual;

            showToast('Apenas Gerente e Administrador podem excluir frotas.', true);
            return;
          }
          const id = btn.dataset.excluirFrota;
          const f = getFrotaById(id);
          if (!f) return;
          if (confirm(`Excluir frota "${f.nome}"?`)) {
            deleteFrota(id);
            showToast(`Frota "${f.nome}" excluída.`);
            if (state.section === 'frotas') render();
          }
        });
      });

      document.querySelectorAll('[data-editar-limite]').forEach(btn => {
        btn.addEventListener('click', () => {
          const perfil = perfilAtual;
          if (perfil !== 'admin' && perfil !== 'gerente') {
            showToast('Apenas Gerente e Administrador podem editar o limite.', true);
            return;
          }
          const id = btn.dataset.editarLimite;
          const f = getFrotaById(id);
          if (!f) return;
          const novoPercentual = prompt(`Alterar % do limite para a frota "${f.nome}" (atual: ${limitePercentual}%):`, limitePercentual);
          if (novoPercentual === null) return;
          const p = parseFloat(novoPercentual);
          if (isNaN(p) || p <= 0 || p > 100) { showToast('Percentual deve ser entre 1 e 100.', true); return; }
          setLimitePercentual(p);
          showToast(`Limite percentual alterado para ${p}%`);
          if (state.section === 'frotas') render();
        });
      });

      document.getElementById('btnSalvarLimitePercentual')?.addEventListener('click', () => {
        const input = document.getElementById('inputLimitePercentual');
        if (!input) return;
        const p = parseFloat(input.value);
        if (isNaN(p) || p <= 0 || p > 100) { showToast('Percentual deve ser entre 1 e 100.', true); return; }
        setLimitePercentual(p);
        showToast(`Limite percentual global alterado para ${p}%`);
        if (state.section === 'frotas') render();
      });

      // ===== RCs =====
      document.getElementById('btnNovaRC')?.addEventListener('click', handleNovaRC);

      document.getElementById('rcFiltroStatus')?.addEventListener('change', (e) => { state.rcFilters.status = e.target.value; state.rcPage=1; render(); });
      document.getElementById('rcFiltroDataIni')?.addEventListener('change', (e) => { state.rcFilters.dataIni = e.target.value; state.rcPage=1; render(); });
      document.getElementById('rcFiltroDataFim')?.addEventListener('change', (e) => { state.rcFilters.dataFim = e.target.value; state.rcPage=1; render(); });
      document.getElementById('rcFiltroFornecedor')?.addEventListener('change', (e) => { state.rcFilters.fornecedor = e.target.value; state.rcPage=1; render(); });
      document.getElementById('rcFiltroDestino')?.addEventListener('change', (e) => { state.rcFilters.destino = e.target.value; state.rcPage=1; render(); });
      document.getElementById('btnApplyRCFiltros')?.addEventListener('click', () => { state.rcPage=1; render(); });

      document.querySelector('#appContent')?.addEventListener('click', (e) => {
        const target = e.target.closest('button');
        if (!target) return;

        if (target.dataset.editarRc) {
          const numero = target.dataset.editarRc;
          const rc = rcs.find(r => r.numero === numero);
          if (rc) {
            const container = document.getElementById('rcFormContainer');
            if (container) {
              container.innerHTML = renderFormRC(rc);
              const itensContainer = document.getElementById('rcItensContainer');
              if (itensContainer) {
                itensContainer.innerHTML = '';
                (rc.itens || []).forEach(item => addItemRowRC(itensContainer, item));
              }
              recalcularTotalRC();
              document.getElementById('rcDataBase')?.addEventListener('change', function() {
                const condPag = document.getElementById('rcCondPag')?.value || '0';
                const venc = calcularVencimento(this.value, condPag);
                const vencInput = document.getElementById('rcVencimento');
                if (vencInput) vencInput.value = venc;
              });
              document.getElementById('rcCondPag')?.addEventListener('change', function() {
                const dataBase = document.getElementById('rcDataBase')?.value;
                const venc = calcularVencimento(dataBase, this.value);
                const vencInput = document.getElementById('rcVencimento');
                if (vencInput) vencInput.value = venc;
              });
              document.getElementById('rcDestino')?.addEventListener('change', function() {
                const selected = this.options[this.selectedIndex];
                const limite = selected ? parseMoney(selected.dataset.limite) : 0;
                const display = document.getElementById('rcLimiteDisplay');
                if (display) display.value = fmt.money(limite);
                recalcularTotalRC();
              });
              document.getElementById('formRC')?.addEventListener('submit', function(e) {
                e.preventDefault();
                salvarRascunho(false);
              });
              document.getElementById('btnEnviarRC')?.addEventListener('click', function() {
                salvarRascunho(true);
              });
              document.getElementById('btnCancelarFormRC')?.addEventListener('click', () => {
                document.getElementById('rcFormContainer').innerHTML = '';
                render();
              });
              const destinoSelect = document.getElementById('rcDestino');
              if (destinoSelect) {
                const selected = destinoSelect.options[destinoSelect.selectedIndex];
                if (selected && selected.value) {
                  const limite = parseMoney(selected.dataset.limite);
                  const display = document.getElementById('rcLimiteDisplay');
                  if (display) display.value = fmt.money(limite);
                }
                recalcularTotalRC();
              }
            }
          }
          return;
        }

        if (target.dataset.arquivarRc) {
          if (confirm(`Arquivar requisição ${target.dataset.arquivarRc}?`)) {
            handleArquivarRC(target.dataset.arquivarRc);
          }
          return;
        }

        if (target.dataset.reabrirRc) {
          handleReabrirRC(target.dataset.reabrirRc);
          return;
        }

        if (target.dataset.enviarRc) {
          const numero = target.dataset.enviarRc;
          if (confirm(`Enviar requisição ${numero} para aprovação?`)) {
            const rc = rcs.find(r => r.numero === numero);
            if (!rc) { showToast('RC não encontrada.', true); return; }
            const frota = getFrotaByNome(rc.aplicacao);
            if (frota) {
              const limite = frota.valorOrcamento * (limitePercentual / 100);
              if (rc.total > limite) {
                showToast('VALOR LIMITE ATINGIDO! Solicite aprovação ao gerente.', true);
                return;
              }
            }
            if (updateRC(numero, { status: 'em_aprovacao' })) {
              showToast(`Requisição ${numero} enviada para aprovação!`);
              enviarWhatsApp(rc);
              render();
            } else {
              showToast('Erro ao enviar.', true);
            }
          }
          return;
        }

        if (target.dataset.aprovarRc) {
          handleAprovarRC(target.dataset.aprovarRc);
          return;
        }

        if (target.dataset.rejeitarRc) {
          handleRejeitarRC(target.dataset.rejeitarRc);
          return;
        }

        if (target.dataset.verRcPdf) {
          const numero = target.dataset.verRcPdf;
          const rc = rcs.find(r => r.numero === numero);
          if (rc) gerarPDF(rc);
          return;
        }

        if (target.dataset.whatsRc) {
          const numero = target.dataset.whatsRc;
          const rc = rcs.find(r => r.numero === numero);
          if (rc) enviarWhatsApp(rc);
          return;
        }
      });

      document.getElementById('rejeitarModalClose')?.addEventListener('click', () => {
        document.getElementById('rejeitarModal').classList.remove('active');
      });
      document.getElementById('rejeitarCancel')?.addEventListener('click', () => {
        document.getElementById('rejeitarModal').classList.remove('active');
      });
      document.getElementById('rejeitarModal')?.addEventListener('click', (e) => {
        if (e.target === e.currentTarget) document.getElementById('rejeitarModal').classList.remove('active');
      });
      document.getElementById('formRejeitar')?.addEventListener('submit', (e) => {
        e.preventDefault();
        const justificativa = document.getElementById('rejeitarJustificativa').value.trim();
        if (!justificativa) { showToast('Informe a justificativa.', true); return; }
        const numero = document.getElementById('rejeitarModal').dataset.rcNumero;
        if (numero) {
          if (updateRC(numero, { status: 'rejeitado', justificativa })) {
            showToast(`Requisição ${numero} rejeitada.`);
            document.getElementById('rejeitarModal').classList.remove('active');
            render();
          } else {
            showToast('Erro ao rejeitar.', true);
          }
        }
      });
    }

    /* ============================================================
       FORM NOVO MATERIAL
    ============================================================ */
    function handleFormNovo() {
      const getVal = (id) => document.getElementById(id)?.value || '';
      const getNum = (id) => parseFloat(document.getElementById(id)?.value) || 0;

      const codigo = getVal('novoCodigo');
      const dataCadastro = getVal('novoData') || new Date().toLocaleDateString('pt-BR');
      const usuario = getVal('novoUsuario') || 'Leonardo Santos';
      const cadastroCompleto = getVal('novoCompleto') || 'SIM';
      const descricaoSimples = getVal('novoDescSimples').trim();
      const descricaoCurta = getVal('novoDescCurta').trim();
      const descricaoCompleta = getVal('novoDescCompleta').trim();
      const categoria = getVal('novoCategoria');
      const subcategoria = getVal('novoSubcategoria');
      const unid = getVal('novoUnid');
      const unidDetalhe = getVal('novoUnidDetalhe');
      const ncm = getVal('novoNcm');
      const marca = getVal('novoMarca');
      const modelo = getVal('novoModelo');
      const tipoMaterial = getVal('novoTipoMat');
      const dimensoes = getVal('novoDimensoes');
      const cor = getVal('novoCor');
      const peso = getVal('novoPeso');
      const tensao = getVal('novoTensao');
      const pressao = getVal('novoPressao');
      const temperatura = getVal('novoTemperatura');
      const certificacoes = getVal('novoCertificacoes');
      const localArmazenagem = getVal('novoLocal');
      const estoqueMin = getNum('novoEstMin');
      const estoqueMax = getNum('novoEstMax');
      const pontoPedido = getVal('novoPontoPedido');
      const loteMinimo = getVal('novoLoteMin');
      const leadTime = getVal('novoLeadTime');
      const condicoesArmazenamento = getVal('novoCondArm');
      const custoUnitario = getVal('novoCustoUnit');
      const fornecedor = getVal('novoFornecedor');
      const fornecedoresAlt = getVal('novoFornecedoresAlt');
      const codigoFornecedor = getVal('novoCodFornecedor');
      const moeda = getVal('novoMoeda') || 'Real';

      if (!descricaoSimples || !categoria || !subcategoria || !unid || !fornecedor) {
        showToast('Preencha os campos obrigatórios.', true);
        return;
      }

      const newItem = {
        item: allItems.length + 1,
        dataCadastro,
        usuario,
        cadastroCompleto,
        codigo,
        descricaoSimples,
        descricaoCurta,
        descricaoCompleta,
        categoria,
        subcategoria,
        unid,
        unidDetalhe,
        ncm,
        marca,
        modelo,
        tipoMaterial,
        dimensoes,
        cor,
        peso,
        tensao,
        pressao,
        temperatura,
        certificacoes,
        localArmazenagem,
        estoqueMin: String(estoqueMin),
        estoqueMax: String(estoqueMax),
        pontoPedido,
        loteMinimo,
        leadTime,
        condicoesArmazenamento,
        custoUnitario: custoUnitario ? `R$ ${custoUnitario}` : "",
        custoEstoqueMin: `R$ ${(estoqueMin * parseMoney(custoUnitario)).toFixed(2)}`,
        custoEstoqueMax: `R$ ${(estoqueMax * parseMoney(custoUnitario)).toFixed(2)}`,
        fornecedor,
        fornecedoresAlt,
        codigoFornecedor,
        moeda,
        custoUnitarioNum: parseMoney(custoUnitario),
        custoEstoqueMinNum: estoqueMin * parseMoney(custoUnitario),
        custoEstoqueMaxNum: estoqueMax * parseMoney(custoUnitario),
      };

      addNewItem(newItem);
      showToast(`Material ${codigo} cadastrado com sucesso!`);
      document.getElementById('formNovo')?.reset();
      document.getElementById('novoCodigo').value = getNextCode();
      document.getElementById('novoData').value = new Date().toLocaleDateString('pt-BR');
    }

    /* ============================================================
       EDIÇÃO DE MATERIAL (MODAL)
    ============================================================ */
    function abrirModalEdicao(codigo) {
      const item = allItems.find(i => i.codigo === codigo);
      if (!item) { showToast('Material não encontrado.', true); return; }

      document.getElementById('editCodigo').value = item.codigo;
      document.getElementById('editData').value = item.dataCadastro || '';
      document.getElementById('editUsuario').value = item.usuario || '';
      document.getElementById('editCompleto').value = item.cadastroCompleto || 'SIM';
      document.getElementById('editDescSimples').value = item.descricaoSimples || '';
      document.getElementById('editDescCurta').value = item.descricaoCurta || '';
      document.getElementById('editDescCompleta').value = item.descricaoCompleta || '';
      document.getElementById('editUnidDetalhe').value = item.unidDetalhe || '';
      document.getElementById('editNcm').value = item.ncm || '';
      document.getElementById('editMarca').value = item.marca || '';
      document.getElementById('editModelo').value = item.modelo || '';
      document.getElementById('editTipoMat').value = item.tipoMaterial || '';
      document.getElementById('editDimensoes').value = item.dimensoes || '';
      document.getElementById('editCor').value = item.cor || '';
      document.getElementById('editPeso').value = item.peso || '';
      document.getElementById('editTensao').value = item.tensao || '';
      document.getElementById('editPressao').value = item.pressao || '';
      document.getElementById('editTemperatura').value = item.temperatura || '';
      document.getElementById('editCertificacoes').value = item.certificacoes || '';
      document.getElementById('editLocal').value = item.localArmazenagem || '';
      document.getElementById('editEstMin').value = parseFloat(item.estoqueMin) || 0;
      document.getElementById('editEstMax').value = parseFloat(item.estoqueMax) || 0;
      document.getElementById('editPontoPedido').value = item.pontoPedido || '';
      document.getElementById('editLoteMin').value = item.loteMinimo || '';
      document.getElementById('editLeadTime').value = item.leadTime || '';
      document.getElementById('editCondArm').value = item.condicoesArmazenamento || '';
      document.getElementById('editCustoUnit').value = item.custoUnitario ? item.custoUnitario.replace('R$ ', '') : '';
      document.getElementById('editFornecedoresAlt').value = item.fornecedoresAlt || '';
      document.getElementById('editCodFornecedor').value = item.codigoFornecedor || '';
      document.getElementById('editMoeda').value = item.moeda || 'Real';

      const categorias = getUniqueValues('categoria');
      const subcategorias = getUniqueValues('subcategoria');
      const unidades = getUniqueValues('unid');
      const fornecedoresList = getUniqueValues('fornecedor');

      const catSelect = document.getElementById('editCategoria');
      catSelect.innerHTML = '<option value="">Selecione</option>' + categorias.map(c => `<option value="${c}" ${c===item.categoria?'selected':''}>${c}</option>`).join('');
      const subSelect = document.getElementById('editSubcategoria');
      subSelect.innerHTML = '<option value="">Selecione</option>' + subcategorias.map(s => `<option value="${s}" ${s===item.subcategoria?'selected':''}>${s}</option>`).join('');
      const unidSelect = document.getElementById('editUnid');
      unidSelect.innerHTML = '<option value="">Selecione</option>' + unidades.map(u => `<option value="${u}" ${u===item.unid?'selected':''}>${u}</option>`).join('');
      const fornSelect = document.getElementById('editFornecedor');
      fornSelect.innerHTML = '<option value="">Selecione</option>' + fornecedoresList.map(f => `<option value="${f}" ${f===item.fornecedor?'selected':''}>${f}</option>`).join('');

      document.getElementById('editModal').classList.add('active');
    }

    /* ============================================================
       HANDLERS DE RC (APROVAR/REJEITAR/ARQUIVAR/REABRIR)
    ============================================================ */
    function handleAprovarRC(numero) {
      if (!confirm(`Aprovar requisição ${numero}?`)) return;
      if (updateRC(numero, { status: 'aprovado' })) {
        showToast(`Requisição ${numero} aprovada!`);
        render();
      } else {
        showToast('Erro ao aprovar.', true);
      }
    }

    function handleRejeitarRC(numero) {
      const modal = document.getElementById('rejeitarModal');
      modal.classList.add('active');
      document.getElementById('rejeitarJustificativa').value = '';
      modal.dataset.rcNumero = numero;
    }

    function handleArquivarRC(numero) {
      if (updateRC(numero, { status: 'arquivado' })) {
        showToast(`Requisição ${numero} arquivada.`);
        render();
      }
    }
    function handleReabrirRC(numero) {
      if (updateRC(numero, { status: 'rascunho' })) {
        showToast(`Requisição ${numero} reaberta.`);
        render();
      }
    }

    /* ============================================================
       NAVEGAÇÃO E INICIALIZAÇÃO
    ============================================================ */
    function iniciarSistema() {
      if (typeof window.MATERIAIS_DATA === "undefined") {
        document.getElementById("appContent").innerHTML =
          `<div class="loading"><span style="color:var(--danger)">Erro: data.js não encontrado.<br>Execute <code>python build.py</code> na pasta do projeto.</span></div>`;
        return;
      }
      DATA = window.MATERIAIS_DATA;
      refreshAllItems();
      rcs = loadRCs();
      fornecedores = loadFornecedores();
      frotas = loadFrotas();
      limitePercentual = getLimitePercentual();
      perfilAtual = getPerfil();
      document.getElementById("sidebarSource").textContent = "Fonte: " + DATA.meta.fonte + " + " + (loadLocalItems().length) + " locais";

      // ✅ VINCULE O BOTÃO SAIR AQUI (dentro de iniciarSistema)
      const btnLogout = document.getElementById('btnLogout');
      if (btnLogout) {
        btnLogout.addEventListener('click', logout);
        console.log('Evento de logout vinculado com sucesso.');
      } else {
        console.warn('Botão "Sair" não encontrado em iniciarSistema.');
      }

      render();

      document.querySelectorAll(".nav-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          document.querySelectorAll(".nav-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.section = btn.dataset.section;
          state.page = 1;
          state.rcPage = 1;
          render();
        });
      });

      document.getElementById("btnResetFilters").addEventListener("click", resetFilters);
      document.getElementById("btnExportCSV").addEventListener("click", exportCSV);
      document.getElementById("btnExportDataJS").addEventListener("click", exportDataJS);

      document.getElementById('editModalClose').addEventListener('click', () => {
        document.getElementById('editModal').classList.remove('active');
      });
      document.getElementById('editCancel').addEventListener('click', () => {
        document.getElementById('editModal').classList.remove('active');
      });
      document.getElementById('editModal').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) document.getElementById('editModal').classList.remove('active');
      });

      document.getElementById('formEdit').addEventListener('submit', (e) => {
        e.preventDefault();
        const codigo = document.getElementById('editCodigo').value;
        const getVal = (id) => document.getElementById(id)?.value || '';
        const getNum = (id) => parseFloat(document.getElementById(id)?.value) || 0;

        const newData = {
          dataCadastro: getVal('editData'),
          usuario: getVal('editUsuario'),
          cadastroCompleto: getVal('editCompleto'),
          descricaoSimples: getVal('editDescSimples'),
          descricaoCurta: getVal('editDescCurta'),
          descricaoCompleta: getVal('editDescCompleta'),
          categoria: getVal('editCategoria'),
          subcategoria: getVal('editSubcategoria'),
          unid: getVal('editUnid'),
          unidDetalhe: getVal('editUnidDetalhe'),
          ncm: getVal('editNcm'),
          marca: getVal('editMarca'),
          modelo: getVal('editModelo'),
          tipoMaterial: getVal('editTipoMat'),
          dimensoes: getVal('editDimensoes'),
          cor: getVal('editCor'),
          peso: getVal('editPeso'),
          tensao: getVal('editTensao'),
          pressao: getVal('editPressao'),
          temperatura: getVal('editTemperatura'),
          certificacoes: getVal('editCertificacoes'),
          localArmazenagem: getVal('editLocal'),
          estoqueMin: String(getNum('editEstMin')),
          estoqueMax: String(getNum('editEstMax')),
          pontoPedido: getVal('editPontoPedido'),
          loteMinimo: getVal('editLoteMin'),
          leadTime: getVal('editLeadTime'),
          condicoesArmazenamento: getVal('editCondArm'),
          custoUnitario: getVal('editCustoUnit') ? `R$ ${getVal('editCustoUnit')}` : '',
          fornecedor: getVal('editFornecedor'),
          fornecedoresAlt: getVal('editFornecedoresAlt'),
          codigoFornecedor: getVal('editCodFornecedor'),
          moeda: getVal('editMoeda'),
        };

        const custoUnitNum = parseMoney(getVal('editCustoUnit'));
        const estMin = getNum('editEstMin');
        const estMax = getNum('editEstMax');
        newData.custoUnitarioNum = custoUnitNum;
        newData.custoEstoqueMinNum = estMin * custoUnitNum;
        newData.custoEstoqueMaxNum = estMax * custoUnitNum;
        newData.custoEstoqueMin = `R$ ${(estMin * custoUnitNum).toFixed(2)}`;
        newData.custoEstoqueMax = `R$ ${(estMax * custoUnitNum).toFixed(2)}`;

        if (updateItem(codigo, newData)) {
          showToast(`Material ${codigo} atualizado com sucesso!`);
          document.getElementById('editModal').classList.remove('active');
          render();
        } else {
          showToast('Erro ao atualizar material.', true);
        }
      });
    }
  </script>
</body>
</html>
