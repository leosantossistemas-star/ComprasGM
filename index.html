<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Materiais — Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    /* ====== ESTILOS (MANTIDOS) ====== */
    :root {
      --bg: #0d0f0d;
      --bg-card: #151815;
      --bg-card-hover: #1a1f1a;
      --bg-sidebar: #111311;
      --border: #252a25;
      --text: #ffffff;
      --text-muted: #8a948a;
      --accent: #a3ff00;
      --accent-dim: rgba(163,255,0,0.12);
      --accent-glow: rgba(163,255,0,0.35);
      --danger: #ff5c5c;
      --warning: #ffb800;
      --radius: 16px;
      --radius-sm: 10px;
      --sidebar-w: 240px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Inter", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }
    /* ===== TELA DE LOGIN ===== */
    #loginScreen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      flex-direction: column;
      gap: 20px;
      padding: 20px;
    }
    #loginScreen.hidden { display: none; }
    .login-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 32px;
      max-width: 400px;
      width: 100%;
    }
    .login-box h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: var(--accent); }
    .login-box .sub { color: var(--text-muted); font-size: 13px; margin-bottom: 24px; }
    .login-box .field { margin-bottom: 16px; }
    .login-box .field label { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); margin-bottom: 6px; }
    .login-box .field input { width: 100%; padding: 12px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text); font: inherit; font-size: 14px; outline: none; transition: border-color 0.15s; }
    .login-box .field input:focus { border-color: var(--accent); }
    .login-box .btn { width: 100%; padding: 12px; font-size: 15px; }
    .login-box .error { color: var(--danger); font-size: 13px; margin-top: 8px; text-align: center; }
    /* ===== SIDEBAR E RESTANTE ===== */
    .sidebar {
      width: var(--sidebar-w);
      min-height: 100vh;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0;
      left: 0;
      z-index: 100;
    }
    .logo { display: flex; align-items: center; gap: 10px; padding: 0 8px 28px; }
    .logo-icon { width: 36px; height: 36px; background: var(--accent); border-radius: 10px; display: grid; place-items: center; font-weight: 700; color: #000; font-size: 14px; }
    .logo-text { font-weight: 700; font-size: 15px; line-height: 1.2; }
    .logo-sub { font-size: 11px; color: var(--text-muted); font-weight: 400; }
    .nav { list-style: none; flex: 1; }
    .nav li { margin-bottom: 4px; }
    .nav-btn {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: var(--radius-sm);
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      text-align: left;
      transition: all 0.15s;
    }
    .nav-btn:hover { background: var(--bg-card); color: var(--text); }
    .nav-btn.active { background: var(--accent); color: #000; font-weight: 600; }
    .nav-btn svg { flex-shrink: 0; opacity: 0.8; }
    .nav-btn.active svg { opacity: 1; }
    .sidebar-footer { padding: 16px 8px 0; border-top: 1px solid var(--border); font-size: 11px; color: var(--text-muted); }
    .main { margin-left: var(--sidebar-w); flex: 1; min-height: 100vh; display: flex; flex-direction: column; }
    .main.hidden { display: none; }
    .header { padding: 16px 32px 0; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .header h1 { font-size: 24px; font-weight: 700; }
    .header-meta { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .header-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .profile-display {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      padding: 4px 16px 4px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-muted);
    }
    .profile-display strong {
      color: var(--accent);
      font-weight: 600;
    }
    .btn {
      padding: 10px 20px;
      border-radius: 999px;
      border: none;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-accent { background: var(--accent); color: #000; }
    .btn-accent:hover { box-shadow: 0 0 20px var(--accent-glow); }
    .btn-ghost { background: var(--bg-card); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: var(--danger); color: #000; }
    .btn-danger:hover { filter: brightness(0.8); }
    .btn-sm { padding: 4px 12px; font-size: 11px; }
    .btn-success { background: #00cc66; color: #000; }
    .btn-success:hover { filter: brightness(0.9); }
    .btn-warning { background: var(--warning); color: #000; }
    .btn-warning:hover { filter: brightness(0.9); }
    .btn-logout { background: transparent; color: var(--text-muted); border: 1px solid var(--border); }
    .btn-logout:hover { border-color: var(--danger); color: var(--danger); }
    .content { padding: 24px 32px 40px; flex: 1; }
    .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .kpi-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; transition: border-color 0.15s; }
    .kpi-card:hover { border-color: #2e352e; }
    .kpi-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px; }
    .kpi-value { font-size: 26px; font-weight: 700; line-height: 1.1; }
    .kpi-value.accent { color: var(--accent); }
    .kpi-value.danger { color: var(--danger); }
    .kpi-sub { font-size: 12px; color: var(--text-muted); margin-top: 6px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 24px; }
    .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; }
    .card-title { font-size: 15px; font-weight: 600; }
    .card-sub { font-size: 12px; color: var(--text-muted); }
    .bar-chart { display: flex; flex-direction: column; gap: 10px; }
    .bar-row { display: grid; grid-template-columns: 140px 1fr 60px; align-items: center; gap: 10px; font-size: 12px; }
    .bar-label { color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-track { height: 8px; background: #1e221e; border-radius: 99px; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #7acc00); border-radius: 99px; transition: width 0.4s ease; box-shadow: 0 0 8px var(--accent-glow); }
    .bar-count { text-align: right; font-weight: 600; color: var(--accent); }
    .supplier-list { list-style: none; display: flex; flex-direction: column; gap: 12px; }
    .supplier-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--bg); border: 1px solid var(--border); }
    .supplier-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--accent-dim); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex-shrink: 0; }
    .supplier-info { flex: 1; min-width: 0; }
    .supplier-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .supplier-sub { font-size: 11px; color: var(--text-muted); }
    .supplier-qty { font-weight: 700; color: var(--accent); font-size: 14px; }
    .filters-card { margin-bottom: 20px; }
    .filters-grid { display: grid; grid-template-columns: 2fr repeat(5, 1fr) auto; gap: 12px; align-items: end; }
    .field label { display: block; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 10px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
      color: var(--text); font: inherit; font-size: 13px; outline: none; transition: border-color 0.15s;
    }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--accent); }
    .field select option { background: #1a1f1a; }
    .filter-result { font-size: 13px; color: var(--text-muted); margin-bottom: 14px; }
    .filter-result strong { color: var(--accent); }
    .table-wrap { overflow-x: auto; border-radius: var(--radius-sm); border: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead { background: #111411; }
    th { padding: 12px 14px; text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); font-weight: 600; white-space: nowrap; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; }
    th:hover { color: var(--accent); }
    th.sorted { color: var(--accent); }
    td { padding: 11px 14px; border-bottom: 1px solid var(--border); vertical-align: middle; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }
    tbody tr { transition: background 0.1s; }
    tbody tr:hover { background: var(--bg-card-hover); }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; }
    .badge-ok { background: var(--accent-dim); color: var(--accent); }
    .badge-pending { background: rgba(255,184,0,0.15); color: var(--warning); }
    .badge-danger { background: rgba(255,92,92,0.15); color: var(--danger); }
    .badge-info { background: rgba(100,200,255,0.15); color: #64c8ff; }
    .code { font-family: monospace; color: var(--accent); font-size: 12px; }
    .pagination { display: flex; align-items: center; justify-content: space-between; margin-top: 16px; font-size: 13px; color: var(--text-muted); flex-wrap: wrap; gap: 8px; }
    .page-btns { display: flex; gap: 6px; flex-wrap: wrap; }
    .page-btn { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; font: inherit; font-size: 13px; }
    .page-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .page-btn.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 700; }
    .page-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .section { display: none; }
    .section.active { display: block; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-grid .field-full { grid-column: 1 / -1; }
    .form-actions { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
    .toast { position: fixed; bottom: 30px; right: 30px; padding: 14px 24px; border-radius: var(--radius-sm); font-weight: 600; font-size: 14px; background: var(--bg-card); border: 1px solid var(--accent); color: var(--accent); box-shadow: 0 8px 30px rgba(0,0,0,0.6); z-index: 999; opacity: 0; transform: translateY(20px); transition: all 0.3s ease; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .toast.error { border-color: var(--danger); color: var(--danger); }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); max-width: 900px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 30px;
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-header h2 { font-size: 20px; }
    .modal-close { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
    .modal-close:hover { color: var(--text); }
    .rc-item-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
    .rc-item-row .field { flex: 1; min-width: 120px; }
    .rc-item-row .btn-remove { background: var(--danger); color: #000; border: none; padding: 6px 12px; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; }
    .rc-item-row .btn-remove:hover { filter: brightness(0.8); }
    .rc-summary { background: var(--bg); padding: 16px; border-radius: var(--radius-sm); margin: 16px 0; border: 1px solid var(--border); }
    .rc-hist-list { display: flex; flex-direction: column; gap: 12px; }
    .rc-hist-item { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
    .rc-hist-item .rc-info { display: flex; gap: 20px; flex-wrap: wrap; }
    .rc-hist-item .rc-info span { color: var(--text-muted); }
    .rc-hist-item .rc-info strong { color: var(--accent); }
    .loading { display: grid; place-items: center; min-height: 60vh; color: var(--text-muted); gap: 12px; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .rc-filters { display: grid; grid-template-columns: repeat(6, 1fr) auto; gap: 12px; align-items: end; margin-bottom: 16px; }
    .whatsapp-numbers { display: flex; gap: 12px; flex-wrap: wrap; }
    .whatsapp-numbers .field { flex: 1; min-width: 150px; }
    .fornecedor-select-wrapper { display: flex; gap: 8px; align-items: end; }
    .fornecedor-select-wrapper .field { flex: 1; }
    .fornecedor-select-wrapper .btn { flex-shrink: 0; margin-bottom: 2px; }
    .status-badge { font-weight: 600; }
    .status-rascunho { color: var(--text-muted); }
    .status-em_aprovacao { color: #64c8ff; }
    .status-aprovado { color: var(--accent); }
    .status-rejeitado { color: var(--danger); }
    .status-bloqueado { color: var(--danger); }
    .status-arquivado { color: #888; }
    .destino-badge { background: var(--bg); padding: 2px 8px; border-radius: 12px; font-size: 11px; border: 1px solid var(--border); }
    .limite-info { font-size: 12px; color: var(--accent); margin-top: 4px; }
    .limite-excedido { color: var(--danger); font-weight: 700; }
    @media (max-width: 1200px) {
      .kpi-grid { grid-template-columns: repeat(2, 1fr); }
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .filters-grid, .rc-filters { grid-template-columns: 1fr 1fr; }
      .form-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .sidebar { display: none; }
      .main { margin-left: 0; }
      .kpi-grid { grid-template-columns: 1fr; }
      .filters-grid, .rc-filters { grid-template-columns: 1fr; }
      .form-grid { grid-template-columns: 1fr; }
      .header { flex-direction: column; align-items: flex-start; }
      .header-actions { width: 100%; justify-content: stretch; }
      .header-actions .btn { flex: 1; text-align: center; }
      .rc-item-row { flex-direction: column; align-items: stretch; }
      .whatsapp-numbers { flex-direction: column; }
    }
  </style>
</head>
<body>

  <!-- ===== TELA DE LOGIN ===== -->
  <div id="loginScreen">
    <div class="login-box">
      <h2>🔐 Acesso ao Sistema</h2>
      <p class="sub">Cadastro de Materiais — Cryotronics</p>
      <form id="loginForm">
        <div class="field">
          <label>Usuário</label>
          <input type="text" id="loginUsuario" placeholder="Digite seu usuário" required autofocus />
        </div>
        <div class="field">
          <label>Senha</label>
          <input type="password" id="loginSenha" placeholder="Digite sua senha" required />
        </div>
        <button type="submit" class="btn btn-accent">Entrar</button>
        <div id="loginError" class="error"></div>
      </form>
    </div>
  </div>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon">CM</div>
      <div><div class="logo-text">Cryotronics</div><div class="logo-sub">Cadastro de Materiais</div></div>
    </div>
    <ul class="nav">
      <li><button class="nav-btn active" data-section="dashboard"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>Dashboard</button></li>
      <li><button class="nav-btn" data-section="materiais"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Materiais</button></li>
      <li><button class="nav-btn" data-section="categorias"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>Categorias</button></li>
      <li><button class="nav-btn" data-section="fornecedores"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>Fornecedores</button></li>
      <li><button class="nav-btn" data-section="frotas"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="8" width="20" height="12" rx="2"/><circle cx="7" cy="16" r="3"/><circle cx="17" cy="16" r="3"/><path d="M8 8V6a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>Frotas</button></li>
      <li><button class="nav-btn" data-section="novo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Novo Cadastro</button></li>
      <li><button class="nav-btn" data-section="requisicoes"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10h18M3 14h18M3 18h12"/><rect x="3" y="4" width="18" height="16" rx="1"/></svg>Requisições</button></li>
    </ul>
    <div class="sidebar-footer" id="sidebarSource">—</div>
  </aside>

  <!-- ===== MAIN ===== -->
  <div class="main" id="mainContent">
    <header class="header">
      <div>
        <h1 id="pageTitle">Dashboard</h1>
        <p class="header-meta" id="pageMeta">Visão geral do cadastro de materiais</p>
      </div>
      <div class="header-actions">
        <div class="profile-display">
          <span>👤 Perfil: <strong id="profileLabel">Carregando...</strong></span>
        </div>
        <button class="btn btn-logout" id="btnLogout">Sair</button>
        <button class="btn btn-ghost" id="btnResetFilters">Limpar filtros</button>
        <button class="btn btn-ghost" id="btnExportCSV">Exportar CSV</button>
        <button class="btn btn-accent" id="btnExportDataJS">Exportar data.js</button>
      </div>
    </header>

    <div class="content" id="appContent">
      <div class="loading"><div class="spinner"></div><span>Carregando dados…</span></div>
    </div>
  </div>

  <!-- ===== MODAIS ===== -->
  <div class="modal-overlay" id="editModal">...</div>
  <div class="modal-overlay" id="novoFornecedorModal">...</div>
  <div class="modal-overlay" id="rejeitarModal">...</div>
  <div id="toast" class="toast"></div>

  <script src="data.js"></script>
  <script>
    /* ============================================================
       SISTEMA DE LOGIN
    ============================================================ */
    const SESSION_KEY = 'cryotronics_session';
    const USUARIOS = [
      { usuario: 'admin', senha: 'Mechatronics@2026', perfil: 'admin' },
      { usuario: 'gerente', senha: 'gerente123', perfil: 'gerente' },
      { usuario: 'encarregado', senha: 'encarregado123', perfil: 'encarregado' },
      { usuario: 'usuario', senha: 'usuario123', perfil: 'usuario' },
    ];

    /* ============================================================
       CHAVES DE ARMAZENAMENTO
    ============================================================ */
    var STORAGE_KEY = 'cryotronics_materiais';
    var RC_STORAGE_KEY = 'cryotronics_rcs';
    var WHATSAPP_STORAGE_KEY = 'cryotronics_whatsapp_numbers';
    var FORNECEDORES_STORAGE_KEY = 'cryotronics_fornecedores';
    var FROTAS_STORAGE_KEY = 'cryotronics_frotas';
    var DEFAULT_WHATSAPP = ['5511999999999', '5511988888888', '5511977777777'];
    var PERFIL_KEY = 'cryotronics_perfil';
    var LIMITE_PERCENTUAL_KEY = 'cryotronics_limite_percentual';

    /* ============================================================
       VARIÁVEIS GLOBAIS (TODAS COM 'var' PARA EVITAR TDZ)
    ============================================================ */
    var DATA = null;
    var allItems = [];
    var rcs = [];
    var fornecedores = [];
    var frotas = [];
    var perfilAtual = 'usuario';
    var limitePercentual = 20;
    var toastTimeout = null;

    /* ============================================================
       ESTADO GLOBAL
    ============================================================ */
    var state = {
      section: "dashboard",
      filters: { busca: "", categoria: "", subcategoria: "", fornecedor: "", cadastroCompleto: "", unidade: "", usuario: "" },
      sort: { col: "codigo", dir: "asc" },
      page: 1,
      perPage: 25,
      rcFilters: { status: "", dataIni: "", dataFim: "", fornecedor: "", destino: "" },
      rcPage: 1,
      rcPerPage: 20,
    };

    /* ============================================================
       UTILITÁRIOS
    ============================================================ */
    const fmt = {
      money: (v) => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" }),
      num: (v) => v.toLocaleString("pt-BR"),
      initials: (s) => (s || "?").split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase(),
      date: (d) => d ? new Date(d).toLocaleDateString("pt-BR") : '—',
      dateInput: (d) => d ? new Date(d).toISOString().slice(0,10) : '',
    };
    function normalize(s) { return (s || "").toLowerCase().normalize("NFD").replace(/\p{Diacritic}/gu, ""); }
    function parseMoney(value) {
      if (!value || !value.trim()) return 0;
      let s = value.replace("R$", "").trim();
      s = s.replace(/[^\d,.-]/g, "");
      if (!s || s === "-") return 0;
      s = s.replace(".", "").replace(",", ".");
      return parseFloat(s) || 0;
    }
    function clean(str) { return (str || "").trim(); }

    /* ============================================================
       FUNÇÕES DE SESSÃO
    ============================================================ */
    function getSession() {
      try { const data = localStorage.getItem(SESSION_KEY); return data ? JSON.parse(data) : null; } catch(e) { return null; }
    }
    function setSession(usuario, perfil) {
      localStorage.setItem(SESSION_KEY, JSON.stringify({ usuario, perfil, loginTime: Date.now() }));
    }
    function clearSession() { localStorage.removeItem(SESSION_KEY); }
    function fazerLogin(usuario, senha) {
      const found = USUARIOS.find(u => u.usuario === usuario && u.senha === senha);
      if (!found) return false;
      setSession(found.usuario, found.perfil);
      return true;
    }
    function logout() {
      console.log('Logout executado');
      clearSession();
      location.reload();
    }

    (function checkSession() {
      const sess = getSession();
      if (sess) {
        document.getElementById('loginScreen').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
        const label = document.getElementById('profileLabel');
        if (label) {
          const nomes = { admin: 'Administrador', gerente: 'Gerente', encarregado: 'Encarregado', usuario: 'Usuário' };
          label.textContent = nomes[sess.perfil] || sess.perfil;
        }
        iniciarSistema();
      } else {
        document.getElementById('loginScreen').classList.remove('hidden');
        document.getElementById('mainContent').classList.add('hidden');
      }
    })();

    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const usuario = document.getElementById('loginUsuario').value.trim();
      const senha = document.getElementById('loginSenha').value;
      const errorEl = document.getElementById('loginError');
      if (!usuario || !senha) { errorEl.textContent = 'Preencha usuário e senha.'; return; }
      if (fazerLogin(usuario, senha)) {
        errorEl.textContent = '';
        location.reload();
      } else {
        errorEl.textContent = 'Usuário ou senha inválidos.';
        document.getElementById('loginSenha').value = '';
        document.getElementById('loginSenha').focus();
      }
    });
    document.getElementById('loginSenha').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') document.getElementById('loginForm').dispatchEvent(new Event('submit'));
    });

    /* ============================================================
       FUNÇÕES AUXILIARES
    ============================================================ */
    function getNextCode() {
      if (!allItems.length) return "CRY-0001";
      const codes = allItems.map(i => i.codigo).filter(c => c && c.startsWith("CRY-"));
      let max = 0;
      codes.forEach(c => { const num = parseInt(c.replace("CRY-", ""), 10); if (!isNaN(num) && num > max) max = num; });
      return "CRY-" + String(max + 1).padStart(4, "0");
    }
    function getNextRCNumber() {
      const stored = loadRCs();
      const nums = stored.map(r => { const n = parseInt(r.numero.replace("RC ", ""), 10); return isNaN(n) ? 0 : n; });
      const max = Math.max(0, ...nums);
      return "RC " + String(max + 1).padStart(4, "0");
    }

    function getWhatsAppNumbers() {
      const saved = localStorage.getItem(WHATSAPP_STORAGE_KEY);
      if (saved) { try { const parsed = JSON.parse(saved); if (Array.isArray(parsed) && parsed.length === 3) return parsed; } catch(e) {} }
      return [...DEFAULT_WHATSAPP];
    }
    function setWhatsAppNumbers(numbers) { localStorage.setItem(WHATSAPP_STORAGE_KEY, JSON.stringify(numbers)); }

    function getPerfil() {
      const sess = getSession();
      if (sess) return sess.perfil;
      return 'usuario';
    }

    function getLimitePercentual() {
      const saved = localStorage.getItem(LIMITE_PERCENTUAL_KEY);
      if (saved) { const val = parseFloat(saved); if (!isNaN(val) && val > 0) return val; }
      return 20;
    }
    function setLimitePercentual(val) {
      localStorage.setItem(LIMITE_PERCENTUAL_KEY, String(val));
      limitePercentual = val;
    }

    // ===== FORNECEDORES =====
    function loadFornecedores() { try { const stored = localStorage.getItem(FORNECEDORES_STORAGE_KEY); return stored ? JSON.parse(stored) : []; } catch(e) { return []; } }
    function saveFornecedores(list) { localStorage.setItem(FORNECEDORES_STORAGE_KEY, JSON.stringify(list)); fornecedores = list; }
    function addFornecedor(nome, contato, telefone, email, obs) {
      const list = loadFornecedores();
      const id = Date.now().toString(36) + Math.random().toString(36).substr(2, 4);
      const novo = { id, nome: clean(nome), contato: clean(contato), telefone: clean(telefone), email: clean(email), obs: clean(obs) };
      list.push(novo);
      saveFornecedores(list);
      return novo;
    }
    function updateFornecedor(id, data) {
      const list = loadFornecedores();
      const idx = list.findIndex(f => f.id === id);
      if (idx === -1) return false;
      list[idx] = { ...list[idx], ...data };
      saveFornecedores(list);
      return true;
    }
    function deleteFornecedor(id) {
      let list = loadFornecedores();
      list = list.filter(f => f.id !== id);
      saveFornecedores(list);
      return true;
    }
    function getFornecedorById(id) { return fornecedores.find(f => f.id === id) || null; }
    function syncFornecedoresFromMateriais() {
      const list = loadFornecedores();
      const nomes = new Set(list.map(f => f.nome.toLowerCase()));
      let changed = false;
      allItems.forEach(item => {
        if (item.fornecedor) {
          const nome = clean(item.fornecedor);
          if (nome && !nomes.has(nome.toLowerCase())) {
            list.push({ id: Date.now().toString(36) + Math.random().toString(36).substr(2, 4), nome, contato: '', telefone: '', email: '', obs: '' });
            nomes.add(nome.toLowerCase());
            changed = true;
          }
        }
      });
      if (changed) saveFornecedores(list);
    }

    // ===== FROTAS =====
    function loadFrotas() { try { const stored = localStorage.getItem(FROTAS_STORAGE_KEY); return stored ? JSON.parse(stored) : []; } catch(e) { return []; } }
    function saveFrotas(list) { localStorage.setItem(FROTAS_STORAGE_KEY, JSON.stringify(list)); frotas = list; }
    function addFrota(nome, valorOrcamento) {
      const list = loadFrotas();
      const id = Date.now().toString(36) + Math.random().toString(36).substr(2, 4);
      const nova = { id, nome: clean(nome), valorOrcamento: parseFloat(valorOrcamento) || 0 };
      list.push(nova);
      saveFrotas(list);
      return nova;
    }
    function updateFrota(id, data) {
      const list = loadFrotas();
      const idx = list.findIndex(f => f.id === id);
      if (idx === -1) return false;
      list[idx] = { ...list[idx], ...data };
      saveFrotas(list);
      return true;
    }
    function deleteFrota(id) {
      let list = loadFrotas();
      list = list.filter(f => f.id !== id);
      saveFrotas(list);
      return true;
    }
    function getFrotaById(id) { return frotas.find(f => f.id === id) || null; }
    function getFrotaByNome(nome) { return frotas.find(f => f.nome === nome) || null; }
    function getLimiteFrota(frotaNome) {
      const frota = getFrotaByNome(frotaNome);
      if (!frota) return 0;
      return frota.valorOrcamento * (limitePercentual / 100);
    }

    // ===== MATERIAIS =====
    function loadLocalItems() { try { const stored = localStorage.getItem(STORAGE_KEY); return stored ? JSON.parse(stored) : []; } catch(e) { return []; } }
    function saveLocalItems(items) { localStorage.setItem(STORAGE_KEY, JSON.stringify(items)); }
    function getCombinedItems() {
      if (!DATA) return [];
      const base = DATA.items || [];
      const local = loadLocalItems();
      const map = new Map();
      base.forEach(item => map.set(item.codigo, item));
      local.forEach(item => { if (item.codigo) map.set(item.codigo, item); });
      return Array.from(map.values());
    }
    function refreshAllItems() {
      allItems = getCombinedItems();
      syncFornecedoresFromMateriais();
    }
    function addNewItem(item) {
      const local = loadLocalItems();
      const idx = local.findIndex(i => i.codigo === item.codigo);
      if (idx !== -1) local.splice(idx, 1);
      local.push(item);
      saveLocalItems(local);
      refreshAllItems();
    }
    function updateItem(codigo, newData) {
      const local = loadLocalItems();
      const idx = local.findIndex(i => i.codigo === codigo);
      if (idx !== -1) {
        local[idx] = { ...local[idx], ...newData };
        saveLocalItems(local);
        refreshAllItems();
        return true;
      }
      const base = DATA?.items || [];
      const baseIdx = base.findIndex(i => i.codigo === codigo);
      if (baseIdx !== -1) {
        const item = { ...base[baseIdx], ...newData };
        local.push(item);
        saveLocalItems(local);
        refreshAllItems();
        return true;
      }
      return false;
    }
    function deleteItem(codigo) {
      const local = loadLocalItems();
      const idx = local.findIndex(i => i.codigo === codigo);
      if (idx !== -1) {
        local.splice(idx, 1);
        saveLocalItems(local);
        refreshAllItems();
        return true;
      }
      return false;
    }

    // ===== RCs =====
    function loadRCs() { try { const stored = localStorage.getItem(RC_STORAGE_KEY); return stored ? JSON.parse(stored) : []; } catch(e) { return []; } }
    function saveRCs(list) { localStorage.setItem(RC_STORAGE_KEY, JSON.stringify(list)); rcs = list; }
    function addRC(rc) { const list = loadRCs(); list.push(rc); saveRCs(list); }
    function updateRC(numero, newData) {
      const list = loadRCs();
      const idx = list.findIndex(r => r.numero === numero);
      if (idx === -1) return false;
      list[idx] = { ...list[idx], ...newData };
      saveRCs(list);
      return true;
    }

    // ===== TOAST (corrigido) =====
    function showToast(msg, isError = false) {
      const el = document.getElementById("toast");
      if (!el) return;
      el.textContent = msg;
      el.className = "toast" + (isError ? " error" : "");
      clearTimeout(toastTimeout);
      void el.offsetWidth;
      el.classList.add("show");
      toastTimeout = setTimeout(() => el.classList.remove("show"), 5000);
    }

    /* ============================================================
       FILTROS E ORDENAÇÃO
    ============================================================ */
    function getUniqueValues(key) {
      if (key === 'fornecedor') {
        return fornecedores.map(f => f.nome).sort();
      }
      const set = new Set();
      allItems.forEach(i => {
        const val = i[key];
        if (val) set.add(val);
      });
      return [...set].sort();
    }

    function getFilteredItems() {
      const f = state.filters;
      const q = normalize(f.busca);
      return allItems.filter(item => {
        if (q) {
          const hay = normalize([item.codigo, item.descricaoSimples, item.descricaoCurta, item.marca, item.modelo, item.fornecedor, item.categoria, item.subcategoria].join(" "));
          if (!hay.includes(q)) return false;
        }
        if (f.categoria && item.categoria !== f.categoria) return false;
        if (f.subcategoria && item.subcategoria !== f.subcategoria) return false;
        if (f.fornecedor && item.fornecedor !== f.fornecedor) return false;
        if (f.unidade && item.unid !== f.unidade) return false;
        if (f.usuario && item.usuario !== f.usuario) return false;
        if (f.cadastroCompleto) {
          const ok = item.cadastroCompleto.toUpperCase() === "SIM";
          if (f.cadastroCompleto === "SIM" && !ok) return false;
          if (f.cadastroCompleto === "NAO" && ok) return false;
        }
        return true;
      });
    }

    function sortItems(items) {
      const { col, dir } = state.sort;
      const mul = dir === "asc" ? 1 : -1;
      return [...items].sort((a, b) => {
        let va = a[col], vb = b[col];
        if (col.endsWith("Num")) return (va - vb) * mul;
        va = normalize(String(va));
        vb = normalize(String(vb));
        return va < vb ? -mul : va > vb ? mul : 0;
      });
    }

    /* ============================================================
       FILTROS PARA RCs
    ============================================================ */
    function getFilteredRCs() {
      const f = state.rcFilters;
      return rcs.filter(rc => {
        if (f.status && rc.status !== f.status) return false;
        if (f.dataIni && rc.data < f.dataIni) return false;
        if (f.dataFim && rc.data > f.dataFim) return false;
        if (f.fornecedor && rc.fornecedor !== f.fornecedor) return false;
        if (f.destino && rc.aplicacao !== f.destino) return false;
        return true;
      });
    }

    /* ============================================================
       RENDERIZAÇÃO (Materiais - mantido)
    ============================================================ */
    function renderFilters(extraFields = true) {
      const categorias = getUniqueValues('categoria');
      const subcategorias = getUniqueValues('subcategoria');
      const fornecedoresList = getUniqueValues('fornecedor');
      const unidades = getUniqueValues('unid');

      return `
        <div class="card filters-card">
          <div class="card-header">
            <div><div class="card-title">Filtros</div><div class="card-sub">Refine a visualização dos materiais</div></div>
          </div>
          <div class="filters-grid">
            <div class="field"><label>Buscar</label><input type="search" id="fBusca" placeholder="Código, descrição, marca, fornecedor…" value="${state.filters.busca}" /></div>
            <div class="field"><label>Categoria</label><select id="fCategoria"><option value="">Todas</option>${categorias.map(c => `<option value="${c}" ${state.filters.categoria===c?'selected':''}>${c}</option>`).join('')}</select></div>
            <div class="field"><label>Subcategoria</label><select id="fSubcategoria"><option value="">Todas</option>${subcategorias.map(s => `<option value="${s}" ${state.filters.subcategoria===s?'selected':''}>${s}</option>`).join('')}</select></div>
            <div class="field"><label>Fornecedor</label><select id="fFornecedor"><option value="">Todos</option>${fornecedoresList.map(f => `<option value="${f}" ${state.filters.fornecedor===f?'selected':''}>${f}</option>`).join('')}</select></div>
            <div class="field"><label>Cadastro</label><select id="fCadastro"><option value="">Todos</option><option value="SIM" ${state.filters.cadastroCompleto==='SIM'?'selected':''}>Completo</option><option value="NAO" ${state.filters.cadastroCompleto==='NAO'?'selected':''}>Pendente</option></select></div>
            ${extraFields ? `<div class="field"><label>Unidade</label><select id="fUnidade"><option value="">Todas</option>${unidades.map(u => `<option value="${u}" ${state.filters.unidade===u?'selected':''}>${u}</option>`).join('')}</select></div>` : `<div></div>`}
            <div class="field"><label>&nbsp;</label><button class="btn btn-accent" id="btnApply" style="width:100%">Aplicar</button></div>
          </div>
        </div>
      `;
    }

    function renderTable(items, opts = {}) {
      const { preview = false, previewLimit = 10, showActions = false } = opts;
      const sorted = sortItems(items);
      const total = sorted.length;
      const perPage = preview ? previewLimit : state.perPage;
      const pages = Math.max(1, Math.ceil(total / perPage));
      if (!preview && state.page > pages) state.page = pages;
      const page = preview ? 1 : state.page;
      const start = (page - 1) * perPage;
      const pageItems = sorted.slice(start, start + perPage);

      const cols = [
        { key: "codigo", label: "Código" },
        { key: "descricaoSimples", label: "Descrição" },
        { key: "categoria", label: "Categoria" },
        { key: "subcategoria", label: "Subcategoria" },
        { key: "unid", label: "UN" },
        { key: "custoUnitario", label: "Custo Unit." },
        { key: "fornecedor", label: "Fornecedor" },
        { key: "cadastroCompleto", label: "Status" },
      ];
      if (showActions) cols.push({ key: "acoes", label: "Ações" });

      const sortIcon = (key) => state.sort.col === key ? (state.sort.dir === "asc" ? " ▲" : " ▼") : "";

      const rows = pageItems.map(item => {
        const status = item.cadastroCompleto.toUpperCase() === "SIM"
          ? '<span class="badge badge-ok">Completo</span>'
          : '<span class="badge badge-pending">Pendente</span>';
        const actions = showActions ? `
          <td>
            <button class="btn btn-ghost" style="padding:4px 12px;font-size:11px;" data-edit="${item.codigo}">Editar</button>
            <button class="btn btn-danger" style="padding:4px 12px;font-size:11px;" data-delete="${item.codigo}">Excluir</button>
          </td>
        ` : '';
        return `<tr>
          <td><span class="code">${item.codigo}</span></td>
          <td title="${item.descricaoCurta || item.descricaoSimples}">${item.descricaoSimples}</td>
          <td title="${item.categoria}">${item.categoria}</td>
          <td title="${item.subcategoria}">${item.subcategoria}</td>
          <td>${item.unid}</td>
          <td>${item.custoUnitario || "—"}</td>
          <td title="${item.fornecedor}">${item.fornecedor || "—"}</td>
          <td>${status}</td>
          ${actions}
        </tr>`;
      }).join("");

      const pageBtns = [];
      for (let p = 1; p <= pages; p++) {
        if (pages > 7 && Math.abs(p - page) > 2 && p !== 1 && p !== pages) {
          if (p === 2 || p === pages - 1) pageBtns.push("<span style='padding:0 4px'>…</span>");
          continue;
        }
        pageBtns.push(`<button class="page-btn ${p === page ? "active" : ""}" data-page="${p}">${p}</button>`);
      }

      const paginationHtml = preview ? "" : `
        <div class="pagination">
          <span>Página ${page} de ${pages} · ${start + 1}–${Math.min(start + perPage, total)} de ${total}</span>
          <div class="page-btns">
            <button class="page-btn" data-page="prev" ${page <= 1 ? "disabled" : ""}>‹</button>
            ${pageBtns.join("")}
            <button class="page-btn" data-page="next" ${page >= pages ? "disabled" : ""}>›</button>
          </div>
        </div>`;

      return `
        <div class="filter-result">Exibindo <strong>${total}</strong> de <strong>${allItems.length}</strong> materiais${preview ? " · prévia" : ""}</div>
        <div class="table-wrap">
          <table>
            <thead><tr>${cols.map(c => `<th class="${state.sort.col === c.key ? "sorted" : ""}" data-sort="${c.key}">${c.label}${sortIcon(c.key)}</th>`).join("")}</tr></thead>
            <tbody>${rows || `<tr><td colspan="${cols.length}" style="text-align:center;padding:32px;color:var(--text-muted)">Nenhum material encontrado</td></tr>`}</tbody>
          </table>
        </div>
        ${paginationHtml}
      `;
    }

    function renderBarChart(items, labelKey, valueKey = null) {
      const counts = {};
      items.forEach(i => {
        const k = i[labelKey] || "Sem categoria";
        const v = valueKey ? (i[valueKey] || 0) : 1;
        counts[k] = (counts[k] || 0) + v;
      });
      const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 12);
      const max = sorted[0]?.[1] || 1;
      const isMoney = valueKey === 'total' || valueKey === 'custo';
      return sorted.map(([nome, qtd]) => `
        <div class="bar-row">
          <span class="bar-label" title="${nome}">${nome}</span>
          <div class="bar-track"><div class="bar-fill" style="width:${(qtd / max * 100).toFixed(1)}%"></div></div>
          <span class="bar-count">${isMoney ? fmt.money(qtd) : qtd}</span>
        </div>
      `).join("");
    }

    function renderSupplierList(items) {
      const counts = {};
      items.forEach(i => {
        const k = i.fornecedor || "Não informado";
        counts[k] = (counts[k] || 0) + 1;
      });
      return Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 8).map(([nome, qtd]) => `
        <li class="supplier-item">
          <div class="supplier-avatar">${fmt.initials(nome)}</div>
          <div class="supplier-info">
            <div class="supplier-name">${nome}</div>
            <div class="supplier-sub">${qtd} material${qtd > 1 ? "is" : ""}</div>
          </div>
          <span class="supplier-qty">${qtd}</span>
        </li>
      `).join("");
    }

    /* ============================================================
       SEÇÕES
    ============================================================ */
    function renderDashboard() {
      const filtered = getFilteredItems();
      const completos = filtered.filter(i => i.cadastroCompleto.toUpperCase() === "SIM").length;
      const custoMin = filtered.reduce((s, i) => s + (i.custoEstoqueMinNum || 0), 0);
      const custoMax = filtered.reduce((s, i) => s + (i.custoEstoqueMaxNum || 0), 0);
      const cats = new Set(filtered.map(i => i.categoria).filter(Boolean)).size;

      return `
        ${renderFilters()}
        <div class="kpi-grid">
          <div class="kpi-card"><div class="kpi-label">Total de Materiais</div><div class="kpi-value accent">${fmt.num(filtered.length)}</div><div class="kpi-sub">de ${fmt.num(allItems.length)} cadastrados</div></div>

    function renderCategorias() {
      const filtered = getFilteredItems();
      const counts = {};
      filtered.forEach(i => {
        const cat = i.categoria || "Sem categoria";
        if (!counts[cat]) counts[cat] = { total: 0, subs: {}, completos: 0 };
        counts[cat].total++;
        if (i.cadastroCompleto.toUpperCase() === "SIM") counts[cat].completos++;
        const sub = i.subcategoria || "—";
        counts[cat].subs[sub] = (counts[cat].subs[sub] || 0) + 1;
      });
      const cards = Object.entries(counts).sort((a,b)=>b[1].total-a[1].total).map(([cat, info]) => `
        <div class="card" style="margin-bottom:12px">
          <div class="card-header"><div><div class="card-title">${cat}</div><div class="card-sub">${info.total} materiais · ${info.completos} completos</div></div><span class="badge badge-ok">${info.total}</span></div>
          <div class="bar-chart">${Object.entries(info.subs).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([sub, qtd]) => {
            const max = info.total;
            return `<div class="bar-row"><span class="bar-label" title="${sub}">${sub}</span><div class="bar-track"><div class="bar-fill" style="width:${(qtd/max*100).toFixed(1)}%"></div></div><span class="bar-count">${qtd}</span></div>`;
          }).join("")}</div>
        </div>
      `).join("");
      return `${renderFilters(false)}<div class="grid-2">${cards}</div>`;
    }

    /* ============================================================
       TABELA DE RCs
    ============================================================ */
    function renderRCTable(items) {
      const perfil = perfilAtual;
      const total = items.length;
      const perPage = state.rcPerPage;
      const pages = Math.max(1, Math.ceil(total / perPage));
      if (state.rcPage > pages) state.rcPage = pages;
      const page = state.rcPage;
      const start = (page - 1) * perPage;
      const pageItems = items.slice(start, start + perPage);

      const cols = [
        { key: "numero", label: "RC" },
        { key: "status", label: "Status" },
        { key: "fornecedor", label: "Fornecedor" },
        { key: "total", label: "Valor Total" },
        { key: "data", label: "Data" },
        { key: "destino", label: "Destino" },
        { key: "acoes", label: "Ações" },
      ];

      const rows = pageItems.map(rc => {
        const statusMap = {
          rascunho: { label: 'Rascunho', cls: 'status-rascunho' },
          em_aprovacao: { label: 'Em Aprovação', cls: 'status-em_aprovacao' },
          aprovado: { label: 'Aprovado', cls: 'status-aprovado' },
          rejeitado: { label: 'Rejeitado', cls: 'status-rejeitado' },
          bloqueado: { label: 'Bloqueado (limite)', cls: 'status-bloqueado' },
          arquivado: { label: 'Arquivado', cls: 'status-arquivado' },
        };
        const st = statusMap[rc.status] || { label: rc.status, cls: '' };
        const destinoLabel = rc.aplicacao || '—';
        const totalVal = rc.total || 0;

        let acoes = [];

        if (rc.status !== 'rascunho' && rc.status !== 'arquivado') {
          acoes.push(`<button class="btn btn-ghost btn-sm" data-ver-rc-pdf="${rc.numero}">PDF</button>`);
          acoes.push(`<button class="btn btn-ghost btn-sm" data-whats-rc="${rc.numero}">Whats</button>`);
        }

        if (perfil === 'usuario' || perfil === 'admin') {
          if (rc.status === 'rascunho' && rc.criadoPor === perfilAtual) {
            acoes.unshift(`<button class="btn btn-ghost btn-sm" data-editar-rc="${rc.numero}">Editar</button>`);
            acoes.unshift(`<button class="btn btn-warning btn-sm" data-arquivar-rc="${rc.numero}">Arquivar</button>`);
            acoes.unshift(`<button class="btn btn-accent btn-sm" data-enviar-rc="${rc.numero}">Enviar</button>`);
          }
          if (rc.status === 'arquivado' && rc.criadoPor === perfilAtual) {
            acoes.unshift(`<button class="btn btn-ghost btn-sm" data-reabrir-rc="${rc.numero}">Reabrir</button>`);
          }
        }

        if (perfil === 'gerente' || perfil === 'admin') {
          if (rc.status === 'em_aprovacao') {
            acoes.unshift(`<button class="btn btn-success btn-sm" data-aprovar-rc="${rc.numero}">Aprovar</button>`);
            acoes.unshift(`<button class="btn btn-danger btn-sm" data-rejeitar-rc="${rc.numero}">Rejeitar</button>`);
          }
        }

        return `<tr>
          <td><span class="code">${rc.numero}</span></td>
          <td><span class="status-badge ${st.cls}">${st.label}</span></td>
          <td title="${rc.fornecedor || '—'}">${rc.fornecedor || '—'}</td>
          <td><strong>${fmt.money(totalVal)}</strong></td>
          <td>${fmt.date(rc.data)}</td>
          <td><span class="destino-badge">${destinoLabel}</span></td>
          <td>${acoes.join(' ')}</td>
        </tr>`;
      }).join('');

      const pageBtns = [];
      for (let p = 1; p <= pages; p++) {
        if (pages > 7 && Math.abs(p - page) > 2 && p !== 1 && p !== pages) {
          if (p === 2 || p === pages - 1) pageBtns.push("<span style='padding:0 4px'>…</span>");
          continue;
        }
        pageBtns.push(`<button class="page-btn ${p === page ? "active" : ""}" data-rc-page="${p}">${p}</button>`);
      }

      return `
        <div class="filter-result">Exibindo <strong>${total}</strong> requisições</div>
        <div class="table-wrap">
          <table>
            <thead><tr>${cols.map(c => `<th>${c.label}</th>`).join('')}</tr></thead>
            <tbody>${rows || `<tr><td colspan="${cols.length}" style="text-align:center;padding:32px;color:var(--text-muted)">Nenhuma requisição encontrada</td></tr>`}</tbody>
          </table>
        </div>
        <div class="pagination">
          <span>Página ${page} de ${pages}</span>
          <div class="page-btns">
            <button class="page-btn" data-rc-page="prev" ${page <= 1 ? "disabled" : ""}>‹</button>
            ${pageBtns.join("")}
            <button class="page-btn" data-rc-page="next" ${page >= pages ? "disabled" : ""}>›</button>
          </div>
        </div>
      `;
    }

              <div class="field"><label>Data Base *</label><input type="date" id="rcDataBase" value="${data.dataBase || today}" required /></div>
              <div class="field"><label>Vencimento (automático)</label><input type="date" id="rcVencimento" value="${data.vencimento || ''}" readonly style="background:#1a1f1a;color:var(--accent);font-weight:600;" /></div>
              <div class="field"><label>Solicitante *</label><input type="text" id="rcSolicitante" value="${data.solicitante || perfilAtual}" required placeholder="Seu nome" /></div>
              <div class="field"><label>Destino (Frota) *</label>
                <select id="rcDestino" required>
                  <option value="">Selecione uma frota</option>
                  ${frotasList.map(f => {
                    const limite = f.valorOrcamento * (limitePercentual / 100);
                    return `<option value="${f.nome}" data-limite="${limite}" data-valor="${f.valorOrcamento}" ${selectedFrota===f.nome?'selected':''}>${f.nome} (Limite: ${fmt.money(limite)})</option>`;
                  }).join('')}
                </select>
              </div>
              <div class="field"><label>Limite Disponível</label>
                <input type="text" id="rcLimiteDisplay" readonly style="background:#1a1f1a;color:var(--accent);font-weight:600;" value="${selectedFrota ? fmt.money(getLimiteFrota(selectedFrota)) : 'R$ 0,00'}" />
              </div>
              <div class="field"><label>Observações</label><input type="text" id="rcObservacoes" value="${data.observacoes || ''}" placeholder="Observações gerais" /></div>
            </div>

            <div style="margin:20px 0">
              <div class="card-header"><div><div class="card-title">Itens</div></div></div>
              <div id="rcItensContainer"></div>
              <button type="button" class="btn btn-ghost" id="btnAddItemRC" style="margin-top:8px">+ Adicionar Item</button>
